<!DOCTYPE html>
<html>
    <head>
        <title>Advanced Search</title>
        <link rel=stylesheet href="styles.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    </head>
    <body>
        <div id=nav><a href="index.html">Google Search</a></div>
        <h1 id="title">Advanced Search</h1>
        <div id="line"></div>
        <div id="fpw">
            <p id="para">Find pages with...</p>
        </div>
        <div>
            <form action="https://www.google.com/search" method="get">
                <div class="do">
                    <p class="text">all these words:</p>
                    <div class="shift"><input class="form-control" type="text" name="as_q"></div>
                </div>
                <div class="do">
                    <p class="text">this exact word or phrase:</p>
                    <div class="shift"><input class="form-control" type="text" name="as_epq"></div>
                </div>
                <div class="do">
                    <p class="text">any of these words:</p>
                    <div class="shift"><input class="form-control" type="text" name="as_oq"></div>
                </div>
                <div class="do">
                    <p class="text">none of these words:</p>
                    <div class="shift"><input class="form-control" type="text" name="as_eq"></div>
                </div>
                <div class="do">
                    <div id="lastone"></div>
                    <input id= "submit" type="submit" value="Advanced Search">
                </div>
            </form>
        </div>
    </body>
</html>
